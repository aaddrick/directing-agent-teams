name: checks

# Cheap gates for what a reviewer cannot see: a malformed manifest, a skill or
# agent frontmatter that broke, a file or agent the skill names that does not
# ship, and README install commands that drifted from the manifests.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Manifests, skill and agent frontmatter, file and agent references
        run: python3 scripts/check_configs.py

      - name: README install commands match the manifests
        run: python3 -m unittest discover -s tests -v
